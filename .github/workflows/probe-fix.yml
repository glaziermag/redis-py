name: probe-fix
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'branch to test through the composite action'
        default: 'fix/async-pubsub-wait-budget'
env:
  CURRENT_REDIS_VERSION: '8.8.0'
  REDIS_VERSION_CUSTOM_MAP: >-
    8.10:8.10.0
  COVERAGE_CORE: sysmon
jobs:
  cell:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { redis: '8.10', python: '3.14', config: '3-unified_responses-standalone' }
          - { redis: '8.10', python: '3.14', config: 'default-unified_responses-standalone' }
          - { redis: '8.10', python: '3.10', config: '3-unified_responses-standalone' }
          - { redis: '8.8.0', python: '3.14', config: '3-legacy_responses-standalone' }
    name: Redis ${{ matrix.redis }}; Python ${{ matrix.python }}; ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v7
      - name: Run tests on ${{ inputs.ref }} (project composite action)
        uses: ./.github/actions/run-tests
        with:
          repository: glaziermag/redis-py
          ref: ${{ inputs.ref }}
          python-version: ${{ matrix.python }}
          parser-backend: plain
          redis-version: ${{ matrix.redis }}
          event-loop: asyncio
          test-config: ${{ matrix.config }}
